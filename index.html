<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍길순의 미니홈피</title>
    <script>
        .clock-container {
            border: 2px solid #333;
            padding: 15px;
            width: 300px;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        .clock-title {
            margin: 0;
            color: #555; /* 오타 수정: colocr -> color */
        }

        #digital-clock {
            font-size: 2rem;
            font-weight: bold;
            color: #007bff;
            font-family: monospace;
        }

        #meal-box {
            font-size: 1.2rem;
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #28a745;
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="clock-container">
        <h3 class="clock-title">현재 시간</h3>
        <div id="digital-clock">00:00:00</div>
    </div>
    
    <script>
        // [1] 실시간 시계 기능
        const updateClock = () => {
            const now = new Date();
            let hours = now.getHours();    // 공백 정리
            let minutes = now.getMinutes();
            let seconds = now.getSeconds(); // 오타 수정: new.getSeconds() -> now.getSeconds()

            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            if (seconds < 10) seconds = '0' + seconds;

            document.querySelector('#digital-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        // 시계 타이머 실행
        setInterval(updateClock, 1000);
        updateClock();
    
    <!-- 고정 메뉴 -->
    <header id="header">
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT ME</a></li>
            <li><a href="#">NOTICE</a></li>
            <li><a href="#">CONTACT</a></li>
        </ul>
    </header>

    <!-- 메인 영역 -->
    <div id="container">
        <!-- 프로필 -->
        <div class="profile">
            <h1>홍길순의 미니홈피</h1>
            <h2>웹개발자</h2>
            <img src="images/fropile.jpg" alt="프로필 이미지">
            <p>
                안녕하세요? 저는 웹 개발자가 되고 싶은 고등학생입니다.
                새로운 기술을 배우는 것을 좋아하고 도전하는 것을 즐깁니다.
            </p>
            <ul>
                <li>📧 이메일: hong@example.com</li>
                <li>📍 위치: 서울시 성동구</li>
                <li>💡 관심 분야: 디자인, HTML, CSS, JavaScript</li>
            </ul>
        </div>

        <!-- 공지사항 + 본문 -->
        <div class="notice">
            <div class="table-box">
                <h3>📢 공지사항</h3>
                <table>
                    <tr>
                        <th>제목</th>
                        <th>날짜</th>
                    </tr>
                    <tr>
                        <td>1학기 프로젝트 발표 안내</td>
                        <td>2026-06-01</td>
                    </tr>
                    <tr>
                        <td>팀 회의 일정 변경</td>

                    </tr>
                    <tr>
                        <td>중간 점검 결과 피드백</td>
                        <td>2026-05-20</td>
                    </tr>
                    <tr>
                        <td><a href="timetable.html">나만의 시간표 ver1.0</a></td>
                        <td>2026-05-10</td>
                    </tr>
                </table>
            </div>

            <div class="content">
                <p>
                    저는 이번 프로젝트에서 웹 접근성을 고려한 디자인을 목표로
                    삼고 있어요. 특히 <span>모든 사람이 쉽게 사용할 수 있는
                    웹사이트</span>를 만드는 것이 중요하다고 생각합니다.
                    이를 위해 팀원들과 함께 HTML, CSS 구조를 고민하며 작업 중입니다.
                </p>
            </div>
        </div>
    </div>

    <footer id="footer">
        <address>&copy; 2026 성일정보고. All rights reserved.</address>
    </footer>
</body>
</html>
