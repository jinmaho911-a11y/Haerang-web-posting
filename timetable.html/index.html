<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시간표</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 90%;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        .time {
            background-color: #ddd;
            font-weight: bold;
        }

        .lunch {
            background-color: #ffcc80;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>학교 시간표</h1>

<table>
    <tr>
        <th>시간</th>
        <th>월</th>
        <th>화</th>
        <th>수</th>
        <th>목</th>
        <th>금</th>
    </tr>

    <tr>
        <td class="time">1교시<br>09:00 ~ 09:50</td>
        <td>국어</td>
        <td>수학</td>
        <td>영어</td>
        <td>과학</td>
        <td>사회</td>
    </tr>

    <tr>
        <td class="time">2교시<br>10:00 ~ 10:50</td>
        <td>수학</td>
        <td>국어</td>
        <td>과학</td>
        <td>영어</td>
        <td>체육</td>
    </tr>

    <tr>
        <td class="time">3교시<br>11:00 ~ 11:50</td>
        <td>영어</td>
        <td>사회</td>
        <td>국어</td>
        <td>수학</td>
        <td>음악</td>
    </tr>

    <tr>
        <td class="time">4교시<br>12:00 ~ 12:50</td>
        <td>과학</td>
        <td>영어</td>
        <td>수학</td>
        <td>국어</td>
        <td>미술</td>
    </tr>

    <tr>
        <td class="time lunch">점심시간<br>12:50 ~ 13:50</td>
        <td class="lunch" colspan="5">점심시간</td>
    </tr>

    <tr>
        <td class="time">5교시<br>13:50 ~ 14:40</td>
        <td>사회</td>
        <td>과학</td>
        <td>체육</td>
        <td>음악</td>
        <td>국어</td>
    </tr>

    <tr>
        <td class="time">6교시<br>14:50 ~ 15:40</td>
        <td>체육</td>
        <td>미술</td>
        <td>사회</td>
        <td>과학</td>
        <td>수학</td>
    </tr>

    <tr>
        <td class="time">7교시<br>15:50 ~ 16:40</td>
        <td>자율</td>
        <td>동아리</td>
        <td>자습</td>
        <td>체육</td>
        <td>자습</td>
    </tr>

</table>

</body>
</html>
